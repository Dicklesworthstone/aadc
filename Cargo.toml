[package]
name = "aadc"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "ASCII Art Diagram Corrector: fixes misaligned right borders in ASCII diagrams"
repository = "https://github.com/Dicklesworthstone/aadc"
keywords = ["ascii", "diagram", "alignment", "cli", "terminal"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
dirs = "7.0"
globset = "0.4"
ignore = "0.4"
notify = { version = "9.0", default-features = false, features = ["macos_kqueue"] }
rich_rust = { version = "0.2.4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
toml = "1.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "correction"
harness = false

[profile.release]
opt-level = 3       # Optimize for speed
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
panic = "abort"     # Smaller binary, no unwinding overhead
strip = true        # Remove debug symbols
